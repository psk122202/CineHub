name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        env:
          # Необязательно: добавьте секрет TMDB_API_KEY в Settings → Secrets → Actions
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk CineHub.apk

      - uses: actions/upload-artifact@v4
        with:
          name: CineHub-apk
          path: CineHub.apk
