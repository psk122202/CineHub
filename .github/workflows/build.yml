name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        env:
          # Необязательно: добавьте секрет TMDB_API_KEY в Settings → Secrets → Actions
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew --no-daemon assembleRelease 2>&1 | tee build.log

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk CineHub.apk

      - uses: actions/upload-artifact@v4
        with:
          name: CineHub-apk
          path: CineHub.apk

      # Готовый APK также кладётся в раздел Releases (удобно скачивать на ТВ)
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest CineHub.apk --title "CineHub (последняя сборка)" --notes "Сборка из коммита ${GITHUB_SHA::7}"

      # При ошибке лог сборки сохраняется в ветку build-logs
      - name: Save build log on failure
        if: failure()
        run: |
          mkdir -p /tmp/logs && cp build.log /tmp/logs/build.log 2>/dev/null || echo "no log" > /tmp/logs/build.log
          cd /tmp/logs
          git init -q -b build-logs
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add build.log && git commit -qm "Build log ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" build-logs
